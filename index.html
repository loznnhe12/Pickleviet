<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pickle Việt – Pickleball 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06090f;color:#eef3f8;font-family:"Be Vietnam Pro",system-ui,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;transition:.15s}
button:hover{background:rgba(255,255,255,.18)} button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;width:100%}
select option{color:#000} input.err{border-color:#ff5c5c}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#ui.show{pointer-events:auto}
#ui.dim{background:rgba(3,6,12,.55);align-items:center;justify-content:center}
.loading{margin:auto;text-align:center}.loading .bar{width:220px;height:6px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin:14px auto}
.loading .bar i{display:block;height:100%;width:40%;background:#c8ff2e;animation:ld 1.1s infinite ease-in-out}@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
.logo{font-weight:800;font-size:44px;letter-spacing:1px;line-height:1}.logo b{color:#c8ff2e;margin-left:6px}.logo span{display:block;font-size:13px;font-weight:600;opacity:.7;letter-spacing:2px;margin-top:6px}
.sub{font-size:13px;opacity:.75;line-height:1.5;margin:8px 0}
.menu{width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;margin:auto 0 auto 2vw;background:linear-gradient(160deg,rgba(8,14,26,.82),rgba(8,14,26,.55));padding:24px;border-radius:22px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.menu .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu .btns .big{grid-column:1/-1;background:#c8ff2e;color:#0b1220;font-size:17px;padding:14px}
.menu .btns .big:nth-child(2){background:#2f7cf6;color:#fff}
.pcard{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}.pcard .pn{font-weight:800;font-size:18px}.pcard .pm{font-size:12.5px;opacity:.8;margin-top:2px}.pcard.big .pn{font-size:22px}
.pcard small{font-weight:600;opacity:.7;font-size:13px}
.panel{background:rgba(8,14,26,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px 20px;overflow:auto;max-height:calc(100% - 64px);width:min(860px,96vw);margin:0 auto}
.panel.center{width:min(560px,94vw);text-align:center}.panel.wide{width:min(1100px,98vw)}
.panel.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:760px){.panel.two{grid-template-columns:1fr}}
#ui.show:not(.dim):not(.side):not(.learnmode){flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;margin:0 auto 10px;width:min(1100px,98vw)}.topbar h2{margin:0;font-size:20px;flex:1}.coins{font-weight:800;color:#ffd23f}
h2{margin:6px 0 12px}h3{margin:14px 0 8px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.08);font-size:14px;cursor:pointer;border:1px solid transparent}
.chip.on{background:#c8ff2e;color:#0b1220;font-weight:800}
.go{display:block;margin:18px 0 0 auto;background:#c8ff2e;color:#0b1220;font-size:17px;padding:12px 26px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;gap:12px;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:11px 14px;cursor:pointer;border:1px solid transparent}
.item:hover{border-color:rgba(200,255,46,.4)}.item.on{border-color:#c8ff2e}.item.lock{opacity:.55;cursor:default}
.it b{display:block}.it span,.ir span{display:block;font-size:12.5px;opacity:.75}.ir{text-align:right}.lk{color:#ffb4b4;opacity:1!important}
.list.small .item{padding:8px 11px}
.hint{color:#c8ff2e;font-size:13px}
.stat{display:flex;align-items:center;gap:10px;margin:7px 0}.stat span{width:140px;font-size:13.5px}.stat b{width:64px;text-align:right}.stat b small{opacity:.6;font-weight:600;margin-left:3px}
.stat button{padding:3px 11px}.barw{flex:1;height:9px;background:rgba(255,255,255,.08);border-radius:5px;position:relative;overflow:hidden}
.barw i{position:absolute;inset:0 auto 0 0;background:#2f7cf6;border-radius:5px}.barw em{position:absolute;inset:0 auto 0 0;background:rgba(200,255,46,.35);border-radius:5px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.07);cursor:pointer}.tab.on{background:#2f7cf6;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;display:flex;gap:10px}.ci{flex:1;display:flex;flex-direction:column;gap:3px}.ci small{opacity:.72;font-size:12px}
.ci button,.ci .eq{margin-top:6px;align-self:flex-start}.buy{background:#2f7cf6}.eq{font-size:12.5px;color:#c8ff2e;font-weight:800;padding:8px 0}
.pad{width:44px;height:66px;border-radius:12px 12px 10px 10px;position:relative;flex:none;box-shadow:0 2px 6px #0006}.pad em{position:absolute;left:0;right:0;top:56%;height:6px;transform:skewY(-14deg)}
.pad span{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:7.5px;font-weight:800;color:#fff;letter-spacing:.3px;overflow:hidden}
.pad:after{content:"";position:absolute;left:18px;bottom:-16px;width:8px;height:18px;background:#22272e;border-radius:3px}
.mini{display:flex;align-items:center;gap:6px;font-size:11.5px}.mini span{width:62px;opacity:.75}.mini i{height:5px;background:#c8ff2e;border-radius:3px;flex:none;max-width:110px}.mini b{font-size:11px;opacity:.85}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #fff6}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25)}.sw i.on{border-color:#c8ff2e;box-shadow:0 0 0 3px rgba(200,255,46,.35)}
.danger{background:#7a1f28}
.rank table,.stats{width:100%;border-collapse:collapse;font-size:13.5px}.rank td,.stats td,.stats th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07)}.rank tr.me{background:rgba(200,255,46,.12);font-weight:800}
.stats th{opacity:.7;font-weight:600}.stats td:first-child{text-align:left}
.bigscore{font-size:52px;font-weight:800;margin:4px 0 10px}.bigscore small{font-size:16px;opacity:.6}
.result.win h2{color:#c8ff2e;font-size:30px}.result.lose h2{color:#ff8a8a;font-size:30px}
.reward{margin-top:12px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);border-radius:12px;padding:10px;font-size:14px}.reward.champ{font-size:16px;background:rgba(200,255,46,.14);border-color:#c8ff2e}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.bracket .col{flex:1;min-width:170px;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.bracket h4{margin:0 0 4px;font-size:13px;opacity:.7;text-align:center}.be{background:rgba(255,255,255,.07);border-radius:10px;padding:7px 9px;font-size:12.5px}.be.me{background:rgba(200,255,46,.16);border:1px solid #c8ff2e}
.next{margin-top:14px;font-size:15px}
.learn{display:flex;width:100%;gap:14px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.learn .lside{width:min(300px,40vw);pointer-events:auto;max-height:100%;overflow:auto}.learn .lside .topbar{width:auto}
.lcard{width:min(400px,46vw);pointer-events:auto;background:rgba(8,14,26,.86);border-radius:18px;padding:14px 18px;max-height:100%;overflow:auto;border:1px solid rgba(255,255,255,.08)}
.lcard h2{font-size:21px;margin:0 0 6px}.lcard h2 small{font-size:13px;opacity:.6;font-weight:600}.lcard ul{padding-left:18px;margin:6px 0;font-size:14px;line-height:1.5}.lcard li{margin:4px 0}
.rule{font-size:13px;background:rgba(47,124,246,.16);border-left:3px solid #2f7cf6;padding:8px 10px;border-radius:8px;margin:8px 0}.src{font-size:11.5px;opacity:.6;margin-top:10px}
@media(max-width:700px){.learn{flex-direction:column}.learn .lside,.lcard{width:100%}.learn .lside{max-height:32%}.lcard{max-height:38%;margin-top:auto}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}#hud.show{display:block}
#score{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.sbrow{display:flex;background:rgba(6,10,18,.82);border-radius:12px;overflow:hidden;font-weight:800;border:1px solid rgba(255,255,255,.1)}
.sbt{display:flex;align-items:center;gap:8px;padding:6px 12px;min-width:150px}.sbt.r{flex-direction:row-reverse}
.sbt .nat{font-size:10px;background:rgba(255,255,255,.14);padding:2px 5px;border-radius:5px}.sbt .nm{font-size:13.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sbt .sc{font-size:24px;min-width:28px;text-align:center}.sbt .gm{font-size:12px;color:#ffd23f}
.sbt.srv .sc{color:#c8ff2e}.sbt.srv .sc:after{content:"●";font-size:9px;vertical-align:super;margin-left:2px}
.sbmid{background:#c8ff2e;color:#0b1220;padding:0 8px;display:flex;align-items:center;font-size:11px}
#sb-meta{font-size:11.5px;opacity:.85;background:rgba(6,10,18,.6);padding:2px 10px;border-radius:8px}
#callmsg{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:34px;font-weight:800;opacity:0;text-shadow:0 2px 12px #000}
#callmsg.pop{animation:pop 1.6s ease forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0}}
#pointmsg{position:absolute;top:30%;left:50%;transform:translateX(-50%) scale(.9);background:rgba(6,10,18,.85);border-radius:14px;padding:10px 18px;text-align:center;opacity:0;transition:.2s}
#pointmsg.show{opacity:1;transform:translateX(-50%) scale(1)}#pointmsg b{display:block;font-size:19px}#pointmsg span{font-size:13.5px;opacity:.85}
#pointmsg.good{border:2px solid #c8ff2e}#pointmsg.bad{border:2px solid #ff6b6b}
#shotlabel{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;opacity:0;text-shadow:0 2px 8px #000}
#shotlabel.pop,#floattext.pop{animation:pop 1.1s ease forwards}
#floattext{position:absolute;top:44%;left:50%;transform:translateX(-50%);font-weight:800;font-size:22px;color:#ffd23f;opacity:0;text-shadow:0 2px 8px #000}
#kitchenwarn{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:#c62828;padding:6px 14px;border-radius:10px;font-weight:800;font-size:13.5px;display:none}#kitchenwarn.show{display:block}
#servehint{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);background:rgba(6,10,18,.8);padding:8px 16px;border-radius:12px;font-size:14px;display:none}#servehint.show{display:block}
@media(max-width:560px){#score{left:max(8px,env(safe-area-inset-left));transform:none;align-items:flex-start;max-width:calc(100vw - 72px)}.sbt{min-width:0;padding:5px 8px;gap:5px}.sbt .nm{max-width:72px;font-size:12px}.sbt .sc{font-size:21px;min-width:22px}.sbt .nat{display:none}#servehint{bottom:36%;font-size:13px;width:max-content;max-width:86vw;text-align:center}}
#pausebtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));pointer-events:auto;font-size:18px;padding:8px 13px;background:rgba(6,10,18,.7)}
#keyhelp{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(6,10,18,.72);padding:7px 14px;border-radius:10px;font-size:12.5px;width:max-content;max-width:94vw;text-align:center;line-height:1.5}
#keyhelp b{color:#c8ff2e}
#fps{position:fixed;left:8px;top:8px;font-size:11px;background:#0008;padding:2px 6px;border-radius:5px;display:none;z-index:9}
#stickzone{position:absolute;left:0;top:18%;bottom:0;width:45%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none;pointer-events:none}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:rgba(200,255,46,.55)}
#shots{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:230px;height:200px;pointer-events:none}
.shotbtn{position:absolute;border-radius:50%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;touch-action:none;box-shadow:0 4px 14px #0007;border:2px solid rgba(255,255,255,.35);font-size:14px}
.shotbtn small{font-size:9.5px;font-weight:600;opacity:.85}.shotbtn.on{transform:scale(.92);filter:brightness(1.25)}
.shotbtn[data-shot=hard]{right:0;bottom:30px;width:96px;height:96px;background:rgba(220,55,55,.82)}
.shotbtn[data-shot=soft]{right:104px;bottom:0;width:78px;height:78px;background:rgba(47,124,246,.82)}
.shotbtn[data-shot=lob]{right:96px;bottom:92px;width:68px;height:68px;background:rgba(124,58,237,.82)}
.shotbtn[data-shot=block]{right:16px;bottom:136px;width:62px;height:62px;background:rgba(20,150,110,.85)}
body.pc #shots,body.pc #stickzone{display:none}body.touch #keyhelp{display:none}
body:not(.inmatch) #hud{display:none}
</style>
</head>
